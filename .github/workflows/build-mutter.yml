        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mutter-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages
        shell: bash
        run: |
