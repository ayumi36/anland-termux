name: Build Mutter Packages

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Linux Distribution'
        required: true
        default: 'Debian 13'
        type: choice
        options:
          - Debian 13
          - Ubuntu 26.04
      tag:
        description: 'Tag'
        required: true
        default: 'anland-5.13-debian-48.7-90'

permissions:
  contents: write

jobs:
  debian-trixie:
    if: ${{ github.event.inputs.distribution == 'Debian 13' }}
    runs-on: ubuntu-26.04-arm
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_BASEDIR: /github/home/mutter
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: /github/home/ccache.stats
    container:
      image: debian:trixie
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt update
          apt build-dep -y mutter
          apt install -y git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mutter-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-mutter-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          printf '%s\n' \
            '#!/bin/sh' \
            'unset CCACHE_DISABLE CCACHE_NOSTATS' \
            'export CCACHE_DIR=/github/home/.cache/ccache' \
            'export CCACHE_BASEDIR=/github/home/mutter' \
            'export CCACHE_COMPILERCHECK=content' \
            'export CCACHE_STATSLOG=/github/home/ccache.stats' \
            'printf ".\\n" >> /github/home/ccache-wrapper.log' \
            'exec /usr/bin/ccache "$@"' \
            > /usr/local/bin/ccache
          chmod 0755 /usr/local/bin/ccache
          test "$(command -v ccache)" = "/usr/local/bin/ccache"
          ccache --set-config=max_size=2G
          ccache --show-config
          ccache --zero-stats
          printf 'int main(void) { return 0; }\n' > /tmp/ccache-smoke.c
          ccache cc -c /tmp/ccache-smoke.c -o /tmp/ccache-smoke.o
          smoke_calls=$(ccache --print-stats | awk \
            '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { total += $2 } END { print total + 0 }')
          test "$smoke_calls" -gt 0
          ccache --zero-stats
          : > "$CCACHE_STATSLOG"
          : > /github/home/ccache-wrapper.log

      - name: Clone repository
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b ${{ github.event.inputs.tag }} --depth 1 https://github.com/lfdevs/mutter.git mutter

      - name: Build Mutter
        shell: bash
        run: |
          echo "Building Mutter..."
          cd ~/mutter
          test "$(command -v ccache)" = "/usr/local/bin/ccache"
          origtargz
          gbp buildpackage -uc -us -jauto \
            --git-builder='debuild --prepend-path=/usr/local/bin -i -I' \
            --git-ignore-branch --git-no-pristine-tar
          wrapper_calls=$(wc -l < /github/home/ccache-wrapper.log)
          ccache --show-stats --verbose
          ccache --show-log-stats
          cacheable_calls=$(ccache --print-log-stats | awk \
            '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { total += $2 } END { print total + 0 }')
          echo "ccache wrapper calls recorded: $wrapper_calls"
          echo "Cacheable calls recorded: $cacheable_calls"
          test "$wrapper_calls" -gt 0
          test "$cacheable_calls" -gt 0
          du -sh "$CCACHE_DIR"
          echo "Mutter build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mutter-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages
        shell: bash
        run: |
          cd ~
          rm -f *dev* *dbgsym* *test*
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.deb" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mutter_${{ github.event.inputs.tag }}
          path: |
            ~/*.deb
            ~/sha256sums.txt
          retention-days: 90

  ubuntu-resolute:
    if: ${{ github.event.inputs.distribution == 'Ubuntu 26.04' }}
    runs-on: ubuntu-26.04-arm
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_BASEDIR: /github/home/mutter
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: /github/home/ccache.stats
    container:
      image: ubuntu:resolute
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt update
          apt build-dep -y mutter
          apt install -y git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mutter-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-mutter-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          printf '%s\n' \
            '#!/bin/sh' \
            'unset CCACHE_DISABLE CCACHE_NOSTATS' \
            'export CCACHE_DIR=/github/home/.cache/ccache' \
            'export CCACHE_BASEDIR=/github/home/mutter' \
            'export CCACHE_COMPILERCHECK=content' \
            'export CCACHE_STATSLOG=/github/home/ccache.stats' \
            'printf ".\\n" >> /github/home/ccache-wrapper.log' \
            'exec /usr/bin/ccache "$@"' \
            > /usr/local/bin/ccache
          chmod 0755 /usr/local/bin/ccache
          test "$(command -v ccache)" = "/usr/local/bin/ccache"
          ccache --set-config=max_size=2G
          ccache --show-config
          ccache --zero-stats
          printf 'int main(void) { return 0; }\n' > /tmp/ccache-smoke.c
          ccache cc -c /tmp/ccache-smoke.c -o /tmp/ccache-smoke.o
          smoke_calls=$(ccache --print-stats | awk \
            '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { total += $2 } END { print total + 0 }')
          test "$smoke_calls" -gt 0
          ccache --zero-stats
          : > "$CCACHE_STATSLOG"
          : > /github/home/ccache-wrapper.log

      - name: Clone repository
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b ${{ github.event.inputs.tag }} --depth 1 https://github.com/lfdevs/mutter.git mutter

      - name: Build Mutter
        shell: bash
        run: |
          echo "Building Mutter..."
          cd ~/mutter
          test "$(command -v ccache)" = "/usr/local/bin/ccache"
          origtargz
